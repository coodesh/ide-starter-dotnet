schemaVersion: 2.2.0
metadata:
  name: ide-starter-dotnet
components:
  - name: tools
    container:
      endpoints:
        - name: app
          targetPort: 3000
          exposure: public
commands:
  - id: install
    exec:
      component: tools
      commandLine: "dotnet restore"
      workingDir: ${PROJECT_SOURCE}
  - id: start
    exec:
      component: tools
      commandLine: "dotnet run --project src/App --urls http://0.0.0.0:3000"
      workingDir: ${PROJECT_SOURCE}
  - id: test
    exec:
      component: tools
      commandLine: "dotnet test"
      workingDir: ${PROJECT_SOURCE}
events:
  postStart:
    - install
    - start
